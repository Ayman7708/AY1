name: Build Ayman7708 Signed APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: actions/setup-flutter@v2
        with:
          flutter-version: '3.19.6'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK Output
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Ayman7708-App.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v3
        with:
          name: Ayman7708-Official-App
          path: build/app/outputs/flutter-apk/Ayman7708-App.apk
